# Version updates (plan item M2.3, audit finding 8.2). Monthly and grouped so
# routine bumps are one or two pull requests to review, not dozens, and do not
# spend free-tier budget (docs/operations/ci-cd.md, "Free-tier budgets"): each
# Dependabot push runs the full CI. Rebasing is off for the same reason;
# comment `@dependabot rebase` on a PR when it is about to be merged.
# Security updates are separate (Settings -> Advanced Security) and ignore the
# cooldown and the schedule.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    # A release is 3 days old before an update takes it, the same wait .npmrc
    # gives `npm install` (min-release-age=3): long enough for a compromised
    # version to be caught and pulled.
    cooldown:
      default-days: 3
    # Held back on purpose. Remove an entry when its reason is gone.
    ignore:
      # Types for the Node the app runs on: .nvmrc pins 24, so @types/node
      # stays on 24.x and typecheck refuses Node 25-only APIs. Move both
      # together.
      - dependency-name: '@types/node'
        versions: ['>= 25']
      # 7.1 turns on rules (set-state-in-effect, preserve-manual-memoization)
      # that flag 63 existing patterns (PR #332). Adopting them is its own
      # refactor; until then this bump would fail lint and, grouped, hold
      # back every other minor and patch update with it.
      - dependency-name: eslint-plugin-react-hooks
        versions: ['>= 7.1.0']
      # Owner decision 2026-10-13: pinned at 3.13.23. 3.14+ (virtual-core
      # 3.18) grows the lazy virtual-vendor chunk from 5.0 to 7.9 KB gzip,
      # past its 7,000 B cap in config/bundle-budget.json, and even 3.13.24+
      # pulls a newer virtual-core. Raising that cap is its own decision
      # (docs/operations/bundle-budget.md).
      - dependency-name: '@tanstack/react-virtual'
        versions: ['> 3.13.23']
      # 2026-10-13: Prettier 3.8+ formats some code differently from 3.7.4
      # (e.g. `for (...; cond; )`), and the prettier/prettier lint rule fails
      # on every file formatted the old way. Upgrading it is its own PR, so
      # in-flight PRs don't churn; pinned at 3.7.4 in package.json.
      - dependency-name: prettier
        versions: ['> 3.7.4']
      # 2026-10-19: eslint-plugin-jsx-a11y 6.10.2 peers on eslint ^3 to ^9, so
      # eslint 10 cannot resolve and `npm ci` fails (grouped majors PR #584,
      # Build & Test run 38600851700). @eslint/js moves with eslint. Remove
      # when a jsx-a11y release supports ESLint 10.
      - dependency-name: eslint
        versions: ['>= 10']
      - dependency-name: '@eslint/js'
        versions: ['>= 10']
      # 2026-10-19: typescript-eslint (8.72.0, latest and canary) peers on
      # typescript <6.1.0 and throws "does not support TS 7.0" at load, and TS
      # 7.0 ships no compiler API. package.json holds ~6.0.3. Remove when
      # typescript-eslint widens its range, or when the side-by-side alias
      # setup (resume-queue.md) is adopted.
      - dependency-name: typescript
        versions: ['>= 6.1']
      # 2026-11-02 (owner approved): @sentry/react 11.10.0 fails `npm run typecheck`
      # (TS2345 at tests/sentryConfig.test.js:117: its new `tunnel` option is typed
      # TunnelInit<...>, which is not assignable to `string`), so the bump is held; the
      # dependency PR #688 took the rest of its group and left it out. This is a
      # workaround for an upstream typing problem that has not been filed yet
      # (AGENTS.md, operating rule 16: report it upstream with the reproduction).
      # Narrowed 2026-11-03 (owner decision) from `>=11.10.0` to the 11.10.x line, which
      # is the only release shown to fail, so later releases (11.11 and up) are proposed
      # again; each such PR's own typecheck says whether the typing is fixed.
      # Remove this entry once a release outside 11.10.x is taken, or when the upstream
      # fix ships; check a release by bumping @sentry/react by hand in a scratch branch
      # and running `npm run typecheck`.
      # 2026-11-10: 11.11.0 (proposed in #717) was tried that way and fails with the same
      # TS2345 at the same line, so the 11.11.x line is held too, by the same rule; the
      # rest of #717's group was taken without it. Still not filed upstream.
      - dependency-name: '@sentry/react'
        versions: ['11.10.x', '11.11.x']
      # 2026-11-09: tailwindcss and @tailwindcss/vite stay on 4.3.3.
      # `@tailwindcss/oxide-wasm32-wasi` 4.3.3 declares `"cpu": ["wasm32"]`; 4.3.4 and
      # 4.3.5 declare no cpu field, so npm installs that WASI fallback (about 6.7 MB and
      # six extra packages) on every platform; no functional break was found. This is
      # a workaround for an upstream bug, reported at
      # https://github.com/tailwindlabs/tailwindcss/issues/20685 (AGENTS.md, operating
      # rule 16). Remove these two entries when a tailwind release restores the cpu
      # field; check a release by bumping both packages by hand in a scratch branch and
      # looking for `@tailwindcss/oxide-wasm32-wasi` in the lockfile on this platform.
      # The two packages move together, so both carry the same versions.
      - dependency-name: tailwindcss
        versions: ['4.3.4', '4.3.5']
      - dependency-name: '@tailwindcss/vite'
        versions: ['4.3.4', '4.3.5']
    groups:
      # Non-major bumps are almost always safe; batch them into one PR.
      minor-and-patch:
        update-types:
          - minor
          - patch
      # Majors arrive together as one PR: a monthly list of what is available,
      # not a merge candidate (no major is planned: remediation plan D6). Take
      # a major as its own planned PR. Not an `ignore`: whether an ignore on
      # majors also suppresses security updates is unverified.
      majors:
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns:
          - '*'
