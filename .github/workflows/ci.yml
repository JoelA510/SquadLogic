name: SquadLogic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Keep the Supabase free-tier project alive (pauses after 7 days idle)
    - cron: '0 12 * * 1' # Every Monday at noon UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Supabase keep-alive (scheduled runs only) ────────────────
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate keep-alive secrets
        run: |
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::VITE_SUPABASE_URL secret is not configured."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY secret is not configured."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ping Supabase REST API
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── Main CI (push and PR only) ──────────────────────────────
  build-and-test:
    if: github.event_name != 'schedule'
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine change scope
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" > changed-files.txt
          else
            git show --name-only --format= "${CURRENT_SHA}" > changed-files.txt
          fi

          if [ ! -s changed-files.txt ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full matrix."
            exit 0
          fi

          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          if grep -Ev '^(docs/|README\.md$|CHANGELOG\.md$|[^/]+\.md$)' changed-files.txt | grep -q .; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Full matrix required."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; running docs-only checks."
          fi

      - name: Docs-only diff check
        if: steps.changes.outputs.docs_only == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
          else
            git show --check --format= "${CURRENT_SHA}"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Unit & Integration Tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test

      - name: Build Frontend
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run frontend:build

      - name: Bundle-budget gate (Wave 6a)
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run check:bundle | tee bundle-budget-report.txt

      - name: Advisor-lint gate (Wave 6a)
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:advisors

      - name: Install Playwright Browsers
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        if: steps.changes.outputs.docs_only != 'true'
        id: e2e
        # Passing --workers=1 guarantees mock sessionStorage isolation per the Epic 19 plan
        run: npm run test:e2e -- --workers=1
        env:
          VITE_USE_MOCK_SUPABASE: 'true'
          TEST_ADMIN_EMAIL: 'admin@squadlogic.app'
          TEST_COACH_EMAIL: 'coach@squadlogic.app'
          TEST_PARENT_EMAIL: 'parent@squadlogic.app'
          TEST_PASSWORD: 'test-password-123'

      - name: Upload Playwright HTML report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bundle-budget report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bundle-budget-report
          path: bundle-budget-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report if present
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ── Deno mirror tests (push and PR only) ─────────────────────
  # The auto-scheduler Edge Function is a Deno port of the core practice
  # scheduler; its assistant-coach conflict seam (Phase 8.1) is covered by
  # supabase/functions/_shared/tests/practice-coaches_test.ts. Only that file
  # runs here: scoring-engine_test.ts's "coach conflict detection" case is
  # red on main (it expects 'Time overlap' in a reason the engine has never
  # produced) and is excluded until that expectation is reconciled. The file
  # list is explicit for that reason, so a new _shared/tests/*_test.ts file has
  # to be added here to run at all.
  deno-mirror-tests:
    if: github.event_name != 'schedule'
    name: Deno Mirror Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.6'

      - name: Practice-coaches seam tests
        # DENO_NO_PACKAGE_JSON: the root package.json declares a `frontend`
        # workspace member with no package.json of its own, which Deno's
        # discovery rejects.
        env:
          DENO_NO_PACKAGE_JSON: '1'
        run: >-
          deno test
          --import-map supabase/functions/import_map.json
          supabase/functions/_shared/tests/practice-coaches_test.ts

      # The Deno arm of the season clock's cross-arm drift check (LIVE-5/LIVE-7).
      # `_shared/timing/seasonClock.ts` mirrors packages/core's season clock
      # because an Edge Function cannot import packages/core; both arms are run
      # against _shared/timing/seasonClock.vectors.json, the JS one from Vitest.
      #
      # Run TWICE, under the two host zones that matter. UTC is the Supabase
      # edge default and is exactly where a host-zone reading hides: the
      # expectations in the table are absolute instants, so an arm that consults
      # the host zone fails one of the two runs. A single run could not tell the
      # difference.
      #
      # --allow-read is for the two sibling-file assertions (the check that the
      # JS arm reads the same table); the vectors arrive as a JSON module import
      # and need no permission.
      - name: Season clock vectors (TZ=UTC — the edge default)
        env:
          DENO_NO_PACKAGE_JSON: '1'
          TZ: UTC
        run: >-
          deno test
          --allow-read=.
          --import-map supabase/functions/import_map.json
          supabase/functions/_shared/tests/season-clock_test.ts

      - name: Season clock vectors (TZ=America/Los_Angeles)
        env:
          DENO_NO_PACKAGE_JSON: '1'
          TZ: America/Los_Angeles
        run: >-
          deno test
          --allow-read=.
          --import-map supabase/functions/import_map.json
          supabase/functions/_shared/tests/season-clock_test.ts

  # ── Deploy Edge Functions (main only) ────────────────────────
  # Prevents edge-function drift: redeploys all Supabase edge functions whenever
  # main changes and CI is green (the import-validation outage was caused by the
  # repo being ahead of the deployed function). Skips automatically when deploy
  # secrets are absent (forks/contributors). Per-function verify_jwt / import_map
  # come from supabase/config.toml so the bulk deploy is deterministic.
  deploy-edge-functions:
    name: Deploy Edge Functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Both gates: the Deno job is the only CI coverage of the seam these
    # functions ship, so a red mirror test must not deploy.
    needs: [build-and-test, deno-mirror-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check deploy secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not configured — skipping edge function deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --project-ref "${SUPABASE_PROJECT_ID}"
