name: SquadLogic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Keep the Supabase free-tier project alive (pauses after 7 days idle)
    - cron: '0 12 * * 1' # Every Monday at noon UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The one Supabase CLI version for every `supabase/setup-cli` step in this
  # workflow (deploy-migrations and deploy-edge-functions). Never `latest`:
  # setup-cli resolves `latest` through an unauthenticated GitHub API call, which
  # hit "rate limit exceeded" on push-to-main runs 1156 and 1174 and turned main
  # red before any deploy ran. migrationGuard.mjs parses this version's
  # `--output-format json` output, so bump it only after checking the new
  # version's shapes against tests/migrationGuard.test.js. Bump procedure:
  # docs/operations/ci-cd.md ("Supabase CLI version").
  SUPABASE_CLI_VERSION: 2.118.0

jobs:
  # ── Supabase keep-alive (scheduled runs only) ────────────────
  keepalive:
    name: Supabase keep-alive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate keep-alive secrets
        run: |
          if [ -z "${SUPABASE_URL}" ]; then
            echo "::error::VITE_SUPABASE_URL secret is not configured."
            exit 1
          fi
          if [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "::error::VITE_SUPABASE_ANON_KEY secret is not configured."
            exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Ping Supabase REST API
        run: |
          curl -sf "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # ── Main CI (push and PR only) ──────────────────────────────
  build-and-test:
    if: github.event_name != 'schedule'
    name: Build & Test
    runs-on: ubuntu-latest
    # Coverage, the build and the mock E2E (191 scenarios, --workers=1) took 34-35 min on
    # 2026-10-27, and one run was cancelled at the old 35-min limit with every test passing.
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine change scope
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # A force-push or history rewrite leaves github.event.before unreachable.
              # Never fall back to docs-only on an unknown base: force the full matrix.
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
              echo "Before SHA ${BEFORE_SHA} is unknown in this checkout (force-push or history rewrite); running full matrix."
              exit 0
            fi
            git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" > changed-files.txt
          else
            git show --name-only --format= "${CURRENT_SHA}" > changed-files.txt
          fi

          if [ ! -s changed-files.txt ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "No changed files detected; running full matrix."
            exit 0
          fi

          echo "Changed files:"
          sed 's/^/  - /' changed-files.txt

          if grep -Ev '^(docs/|README\.md$|CHANGELOG\.md$|[^/]+\.md$)' changed-files.txt | grep -q .; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Full matrix required."
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected; running docs-only checks."
          fi

      - name: Docs-only diff check
        if: steps.changes.outputs.docs_only == 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git diff --check "${BASE_SHA}...${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              # Unreachable while "Determine change scope" forces the full matrix for
              # an unknown before SHA; guarded the same way so it can never exit 128.
              echo "Before SHA ${BEFORE_SHA} is unknown in this checkout (force-push or history rewrite); checking ${CURRENT_SHA} only."
              git show --check --format= "${CURRENT_SHA}"
            else
              git diff --check "${BEFORE_SHA}" "${CURRENT_SHA}"
            fi
          else
            git show --check --format= "${CURRENT_SHA}"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      # Static, no secrets: every migration is well named with a unique version,
      # and a PR may only ADD migrations above the base branch's latest version.
      # The deploy-migrations job refuses out-of-order files at deploy time; this
      # catches them while they are still cheap to rename. See
      # docs/operations/ci-cd.md#database-migrations-deploy-migrations.
      - name: Migration version check
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            node scripts/ci/migrationVersions.mjs --base "${BASE_SHA}"
          else
            node scripts/ci/migrationVersions.mjs
          fi

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      # knip: unused files, exports and dependencies (knip.jsonc; plan M5.5).
      - name: Unused-code check
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:unused

      # With coverage, so the thresholds in vitest.config.js fail the job
      # (plan item M3.1, audit finding 6.1): `npm run test` never measured
      # them. The report is uploaded below (coverage-report).
      - name: Unit & Integration Tests
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:coverage

      # The team-generation wall-clock benchmark, alone and without coverage:
      # v8's instrumentation slows that engine about 9x, so timed inside the
      # coverage run it measured the instrumentation (20.0 s in CI against
      # 0.9-2.1 s without). test:coverage excludes it; this is where it runs,
      # on its focused 3 s budget (tests/performance.test.js).
      - name: Performance benchmark
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run test:perf

      # `npm run build` is the frontend build (`frontend:build`, plan item
      # M6.1), so the script contributors run is the one CI runs.
      - name: Build Frontend
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
        # A production build fails without the Supabase variables (plan item
        # M2.2, vite.config.js). These are well-formed stand-ins, not
        # credentials: `.invalid` never resolves, and this build is never
        # served. Stand-ins rather than VITE_USE_MOCK_SUPABASE=true because the
        # next step measures this build against the bundle budget, and it
        # should be the shape production ships: the real client, no mock chunk.
        # The E2E step runs the dev server with the opt-in.
        #
        # The DSN stand-in is there for the same reason (plan M6): without one,
        # main.jsx's `if (SENTRY_DSN)` folds away and the bundle budget
        # measured a build without Sentry, which production never ships.
        # `.invalid` never resolves; config/bundle-budget.json's Session
        # Replay rule fails (NO MATCH) on a build without it.
        env:
          VITE_SUPABASE_URL: 'https://ci-build.invalid'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_ci-build-stand-in'
          VITE_SENTRY_DSN: 'https://00000000000000000000000000000000@sentry-ci-build.invalid/0'

      - name: Bundle-budget gate (Wave 6a)
        if: steps.changes.outputs.docs_only != 'true'
        shell: bash
        run: |
          set -o pipefail
          npm run check:bundle | tee bundle-budget-report.txt

      - name: Advisor-lint gate (Wave 6a)
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run check:advisors

      - name: Install Playwright Browsers
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: End-to-End Tests
        if: steps.changes.outputs.docs_only != 'true'
        id: e2e
        # Passing --workers=1 guarantees mock sessionStorage isolation per the Epic 19 plan
        run: npm run test:e2e -- --workers=1
        env:
          VITE_USE_MOCK_SUPABASE: 'true'
          TEST_ADMIN_EMAIL: 'admin@squadlogic.app'
          TEST_PASSWORD: 'test-password-123'

      - name: Upload Playwright HTML report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright failure artifacts
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload bundle-budget report
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-budget-report
          path: bundle-budget-report.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload coverage report if present
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ── Deno mirror tests (push and PR only) ─────────────────────
  # The auto-scheduler and fairness-scoring Edge Functions are Deno ports of
  # the core practice scheduler. Everything under
  # supabase/functions/_shared/tests/ is run here, under two host zones.
  #
  # **The file list used to live in this job, and that is what went wrong.**
  # Steps named their test files one by one, so a file not named was never run
  # and nothing said so. `scoring-engine_test.ts` arrived in #310 and had never
  # run once when this was written -- long enough for the engine under it to
  # drift (`assignedTeams` counting assignment rows, publishing a negative
  # `unassignedTeams`). Same shape as #29's hand-maintained `NEW_MIGRATIONS`
  # list in the db harness, and fixed the same way: discovery, a floor, and an
  # exclusion table that is itself checked. See scripts/deno-mirror-tests.sh.
  deno-mirror-tests:
    if: github.event_name != 'schedule'
    name: Deno Mirror Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.6'

      # Discovers every _shared/tests/*_test.ts and runs the set under TZ=UTC
      # and TZ=America/Los_Angeles. The two zones are a real control, not
      # duplication: the season clock's expectations are absolute instants, so
      # an arm that consults the host zone fails exactly one of the two runs
      # (#400, LIVE-5/LIVE-7). The script fails loudly if discovery finds
      # nothing, or fewer files than its stated floor.
      - name: Mirror tests (discovered, both host zones)
        run: bash scripts/deno-mirror-tests.sh

      # `deno test` above type-checks the tests and what they import, and no
      # test imports an `index.ts`; `supabase functions deploy` is not relied on
      # to type-check. calendar-feed sat on main with two type errors (#483).
      # Every function directory is discovered (not listed), and the script
      # fails if it finds none or one has no index.ts. This job gates
      # deploy-edge-functions, so a type error does not deploy.
      - name: Type-check Edge entrypoints (discovered)
        run: bash scripts/deno-check-edge.sh

  # ── Deploy database migrations (main only) ───────────────────
  # Until 2026-09 CI deployed Edge Functions but applied no migrations, and
  # production fell 17 migrations behind. This job closes that gap with
  # `supabase db push`, behind a guard (scripts/ci/migrationGuard.mjs) that
  # FAILS on an out-of-order pending version, more than MAX_PENDING_MIGRATIONS
  # pending (default 5), a remote ledger the CLI cannot map to local files, or
  # CLI output it cannot parse. Reverts are never automatic. Same missing-secret
  # contract as deploy-edge-functions: warn loudly, skip. Runbook:
  # docs/operations/ci-cd.md#database-migrations-deploy-migrations.
  deploy-migrations:
    name: Deploy Database Migrations
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-and-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The operator can require reviewers on this environment in GitHub settings.
    environment: production
    # One migration run at a time; never cancel one part-way through.
    concurrency:
      group: deploy-migrations-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      MAX_PENDING_MIGRATIONS: ${{ vars.MAX_PENDING_MIGRATIONS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deploy secrets
        id: secrets
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_ID}" ] || [ -z "${SUPABASE_DB_PASSWORD}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD not configured — skipping database migrations."
            echo "⚠️ **Database migrations SKIPPED**: SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID / SUPABASE_DB_PASSWORD not configured. Production was not migrated." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node v5+ caches npm on its own once package.json names a
          # packageManager; this job installs nothing, so nothing to cache.
          package-manager-cache: false

      # Pinned (workflow env): the guard parses this version's JSON output.
      - name: Setup Supabase CLI
        if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        # The CLI reads SUPABASE_DB_PASSWORD from the environment (job env above).
        run: supabase link --project-ref "${SUPABASE_PROJECT_ID}"

      - name: Migration list (before)
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase migration list --linked --output-format json > migration-list.json

      # The exit status is captured, not acted on here: the CLI's dry run exits
      # non-zero on an out-of-order file (suggesting --include-all, the unsafe
      # path), and the guard must still run to say what to do instead.
      - name: Dry run
        id: dryrun
        if: steps.secrets.outputs.configured == 'true'
        run: |
          set -uo pipefail
          supabase db push --linked --dry-run --output-format json > dry-run.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          cat dry-run.json

      - name: Safety guard
        id: guard
        if: steps.secrets.outputs.configured == 'true'
        env:
          DRY_RUN_EXIT: ${{ steps.dryrun.outputs.exit }}
        run: node scripts/ci/migrationGuard.mjs --list migration-list.json --dry-run dry-run.json --dry-run-exit "${DRY_RUN_EXIT}"

      - name: Push migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase db push --linked --yes

      # Runs even when the push failed part-way, so the list shows which
      # migrations of the batch did apply.
      - name: Verify nothing pending
        if: ${{ !cancelled() && steps.secrets.outputs.configured == 'true' && steps.guard.outcome == 'success' }}
        run: |
          set -euo pipefail
          supabase migration list --linked
          supabase migration list --linked --output-format json > migration-list-after.json
          node scripts/ci/migrationGuard.mjs --verify --list migration-list-after.json

  # ── Deploy Edge Functions (main only) ────────────────────────
  # Prevents edge-function drift: redeploys all Supabase edge functions whenever
  # main changes and CI is green (the import-validation outage was caused by the
  # repo being ahead of the deployed function). Skips automatically when deploy
  # secrets are absent (forks/contributors). Per-function verify_jwt / import_map
  # come from supabase/config.toml so the bulk deploy is deterministic.
  deploy-edge-functions:
    name: Deploy Edge Functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Both gates: the Deno job is the only CI coverage of the seam these
    # functions ship, so a red mirror test must not deploy. deploy-migrations
    # gates too: functions can depend on new database objects. When migrations
    # skip (secrets missing) that job still succeeds, so functions still deploy.
    needs: [build-and-test, deno-mirror-tests, deploy-migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check deploy secrets
        id: secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${SUPABASE_PROJECT_ID}" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_ID not configured — skipping edge function deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Pinned (workflow env), not `latest`: resolving `latest` hit the GitHub
      # API rate limit on runs 1156 and 1174.
      - name: Setup Supabase CLI
        if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Deploy all edge functions
        if: steps.secrets.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase functions deploy --project-ref "${SUPABASE_PROJECT_ID}"
