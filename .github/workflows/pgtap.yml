name: pgTAP tests

# Conditional trigger: only runs when a PR touches Supabase DB-layer files.
# Keeps GitHub Actions minutes under the free-tier cap (~2000/mo) — a full
# `supabase start` + test cycle costs ~3–5 min per run, so unconditional PR
# triggering would consume ~300 min/mo at typical PR cadence. Limiting to
# migrations + tests + this workflow itself caps it at ~40 min/mo.
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'supabase/config.toml'
      - 'package.json'
      - '.nvmrc'
      - '.github/workflows/pgtap.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pgtap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.95.4

jobs:
  pgtap:
    name: Run pgTAP against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `npm run test:db` runs under Node; take the version the repo pins
      # (.nvmrc) rather than whatever the runner image ships.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node v5+ caches npm on its own once package.json names a
          # packageManager; this job installs nothing, so nothing to cache.
          package-manager-cache: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI version
        run: supabase --version

      - name: Start local Supabase (applies all migrations)
        run: supabase start

      - name: Run pgTAP tests
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
