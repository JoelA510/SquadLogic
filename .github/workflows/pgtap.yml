name: pgTAP tests

# Runs on every pull request to main, with no `paths` filter, because its job
# is a required check in the main ruleset (plan item M3.2, decision D5): a
# required check that does not report on a pull request blocks it forever.
# tests/rulesetRequiredChecks.test.js fails if a filter or a job-level `if`
# comes back. The repository is public, so standard-runner minutes are free;
# a run takes about three minutes.
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pgtap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The one Supabase CLI version, the same as ci.yml's (the deploy jobs and
  # the migration guard's parsed output). tests/supabaseCliPin.test.js fails
  # if the two workflows disagree. Bump procedure: docs/operations/ci-cd.md
  # ("Supabase CLI version").
  SUPABASE_CLI_VERSION: 2.118.0

jobs:
  pgtap:
    name: Run pgTAP against local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `npm run test:db` runs under Node; take the version the repo pins
      # (.nvmrc) rather than whatever the runner image ships.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # setup-node v5+ caches npm on its own once package.json names a
          # packageManager; this job installs nothing, so nothing to cache.
          package-manager-cache: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Verify Supabase CLI version
        run: supabase --version

      # Only what the migrations and the suites use: the database, auth,
      # storage, realtime and the API. Edge Functions, Studio, image
      # transformation, the mail catcher and analytics are left out; the edge
      # runtime's health check failing with a 502 turned a run red that
      # touched none of it (run 38462349853, 2026-10-13).
      - name: Start local Supabase (applies all migrations)
        id: start
        run: supabase start --exclude edge-runtime,studio,imgproxy,mailpit,logflare,vector

      # Supabase's own advisors over the migrated schema (plan item M3.3,
      # audit finding 8.6). The CLI's --fail-on has no waivers, so it reports
      # everything and scripts/ci/supabaseAdvisors.mjs fails on any WARN or
      # ERROR that docs/security/supabase-advisor-waivers.json does not waive
      # with a reason, and on a stale or expired waiver.
      - name: Supabase advisors (unwaived WARN and ERROR block)
        run: |
          set -euo pipefail
          supabase db advisors --local --type all --level info --fail-on none --output-format json > advisors.json
          node scripts/ci/supabaseAdvisors.mjs --input advisors.json

      # Runs even when the advisors step failed, so one run shows both.
      - name: Run pgTAP tests
        if: ${{ !cancelled() && steps.start.outcome == 'success' }}
        run: npm run test:db

      - name: Stop local Supabase
        if: always()
        run: supabase stop
