name: Workflow audit

# Plan item M3.5 (audit finding 7.4). zizmor audits every workflow here and
# .github/dependabot.yml: actions pinned by tag rather than commit, checkouts
# that leave the job's token in .git/config, expressions interpolated into
# `run:` scripts, pull_request_target misuse, and the rest of its default
# audits. Any finding fails the job. With the job's token it also runs its
# online audits, which confirm each pinned SHA is a real commit of the action
# it names and that the `# vX.Y.Z` comment matches it. Its configuration, and
# the reason for each loosened default, is .github/zizmor.yml; a one-off
# exception is an inline `# zizmor: ignore[<audit>] -- <reason>`.
#
# Every `uses:` is pinned by full commit SHA with its release in a comment;
# Dependabot's github-actions updates (.github/dependabot.yml) move the SHA
# and the comment together. tests/workflowPins.test.js holds both rules
# offline, in `npm run test`.
#
# Its own workflow rather than a step of ci.yml's Build & Test: it installs
# nothing from npm, takes seconds, and reports as its own check. Not a
# required check in the main ruleset yet: that is an owner settings change
# (docs/operations/ci-cd.md, "Workflow audit").
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

# Nothing by default; the job asks for what it uses.
permissions: {}

concurrency:
  group: workflow-audit-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pipx ships on GitHub's Ubuntu runners. zizmor is pinned to one release;
      # bump it by hand after reading its changelog (new audits arrive with
      # minor releases and can fail this job on code that has not changed).
      # --format=github annotates each finding on the pull request's diff.
      - name: Audit the workflows (zizmor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run --spec 'zizmor==1.30.1' zizmor --format=github .
