# [ADAPT, THEN DELETE THIS LINE: every step runs a script this repository has, and each job `name` is a required check in .github/rulesets/main.json]
#
# The gate on every pull request (new-project Phase 2.5; existing-project audit §7), for a Node
# project. Another stack keeps the shape (no token permissions, actions pinned by commit, the
# runtime read from its one pin file, one step per gate) and swaps the commands. The dependency
# audit is its own workflow (docs/dependency-policy.md).
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Nothing by default; each job asks for what it uses. These jobs only read the repository.
permissions: {}

# A newer push to the same ref supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job's `name` is a required check in .github/rulesets/main.json: renaming one means
# updating that file and re-importing it in Settings -> Rules (or hold them equal with a test).
jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      # Pinned by commit, with the tag beside it; Dependabot's github-actions updates move both.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # An end-to-end suite gets its own job (and its own required check), so a slow or flaky
  # browser run is visible as itself. Delete this job if the repository has none.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
