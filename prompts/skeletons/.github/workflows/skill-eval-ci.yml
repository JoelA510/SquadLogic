name: Skill content

on:
  pull_request:
    branches: ['[DEFAULT BRANCH]']
  push:
    branches: ['[DEFAULT BRANCH]']
  workflow_dispatch:

permissions: {}
concurrency:
  group: skill-eval-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TIER1_IMAGE: ghcr.io/nvidia/skillevaluator-tier1@sha256:fbff256df8f760019539d442b7cb533d7ec50efab37f4482b7b670e2e4b4189a

jobs:
  scan:
    name: Skill content (SkillEvaluator Tier 1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/skill-tier1.mjs scan .agents/skills "$RUNNER_TEMP/skill-reports"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: skill-tier1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/skill-reports/summary.json
          if-no-files-found: error
          retention-days: 14
  controls:
    name: SkillEvaluator rejects invalid skills
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/skill-tier1.mjs selftest "$RUNNER_TEMP/skill-controls"
